
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Ecommerce Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172554;
        }

        /* Navigation */
        .navbar {
            width: 100%;
            min-height: 75px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 7%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #172554;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #334155;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #eab308;
        }

        .nav-links .register-btn {
            background: #eab308;
            color: #172554;
            padding: 11px 22px;
            border-radius: 7px;
        }

        .nav-links .register-btn:hover {
            background: #facc15;
            color: #172554;
        }

        /* Hero section */
        .hero {
            min-height: 570px;
            margin: 25px 3%;
            border-radius: 15px;
            background: linear-gradient(135deg, #172554, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .hero-content {
            max-width: 850px;
        }

        .hero h1 {
            font-size: 52px;
            line-height: 1.2;
            margin-bottom: 22px;
        }

        .hero p {
            font-size: 20px;
            color: #dbeafe;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .shop-btn {
            display: inline-block;
            background: #facc15;
            color: #172554;
            text-decoration: none;
            padding: 16px 38px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .shop-btn:hover {
            background: #eab308;
            transform: translateY(-3px);
        }

        /* Mobile responsive */
        @media (max-width: 650px) {
            .navbar {
                flex-direction: column;
                gap: 18px;
                padding: 20px;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 14px;
            }

            .hero {
                min-height: 450px;
                margin: 15px;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            ShopSphere.
        </a>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'products' %}">Products</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}" class="register-btn">Register</a>
        </div>

    </nav>

    <section class="hero">

        <div class="hero-content">

            <h1>Welcome to My Ecommerce Store</h1>

            <p>
                Discover the best products at affordable prices.
                Shop smarter, live better.
            </p>

            <a href="{% url 'products' %}" class="shop-btn">
                Shop Now →
            </a>

        </div>

    </section>

</body>
</html>
