
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Ecommerce</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #172554, #1e3a8a);
            display: flex;
            flex-direction: column;
            color: white;
            overflow-x: hidden;
        }

        /* Animated background */
        .light {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(250, 204, 21, 0.13);
            filter: blur(90px);
            animation: float 7s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .light-one {
            top: 10%;
            left: -100px;
        }

        .light-two {
            bottom: 5%;
            right: -100px;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(60px, -40px) scale(1.3);
            }
        }

        /* Navigation */
        .navbar {
            min-height: 75px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            position: relative;
            z-index: 2;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            color: #e2e8f0;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #facc15;
        }

        .nav-links .login-link {
            background: #facc15;
            color: #172554;
            padding: 11px 20px;
            border-radius: 7px;
            font-weight: bold;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 20px;
            perspective: 1200px;
            position: relative;
            z-index: 1;
        }

        /* Login card */
        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.22);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.35);
            animation: appear 0.9s ease forwards;
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .login-card:hover {
            transform: rotateX(2deg) rotateY(-2deg) translateY(-5px);
            box-shadow: 0 35px 70px rgba(0,0,0,0.45);
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(45px) rotateX(8deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .card-heading {
            text-align: center;
            margin-bottom: 32px;
        }

        .card-heading h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .card-heading span {
            color: #facc15;
        }

        .card-heading p {
            color: #cbd5e1;
            font-size: 14px;
        }

        /* Input fields */
        .form-group {
            margin-bottom: 23px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: bold;
            color: #f1f5f9;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.25);
            outline: none;
            background: rgba(15,23,42,0.55);
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            border-color: #facc15;
            box-shadow: 0 0 0 4px rgba(250,204,21,0.15);
            transform: translateY(-2px);
        }

        /* Error message */
        .error {
            color: #fecaca;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(248,113,113,0.4);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 5px;
            border: none;
            border-radius: 9px;
            background: #facc15;
            color: #172554;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 7px 0 #b88b00;
        }

        .login-btn:hover {
            background: #fde047;
            transform: translateY(-4px);
            box-shadow: 0 11px 0 #b88b00,
                        0 15px 25px rgba(250,204,21,0.2);
        }

        .login-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #b88b00;
        }

        .register-text {
            text-align: center;
            margin-top: 27px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .register-text a {
            color: #facc15;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 18px;
                padding: 20px;
            }

            .nav-links {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .login-card {
                padding: 30px 22px;
            }

            .card-heading h1 {
                font-size: 27px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="light light-one"></div>
    <div class="light light-two"></div>

    <!-- Navbar -->
    <nav class="navbar">

        <a href="{% url 'home' %}" class="logo">
            Ecommerce
        </a>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'products' %}">Products</a>
            <a href="{% url 'login' %}" class="login-link">Login</a>
            <a href="{% url 'register' %}">Register</a>
        </div>

    </nav>

    <!-- Login form -->
    <main class="main">

        <div class="login-card">

            <div class="card-heading">
                <h1>Welcome <span>Back!</span></h1>
                <p>Login to continue shopping with us.</p>
            </div>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Login to Account →
                </button>

            </form>

            <div class="register-text">
                Don't have an account?
                <a href="{% url 'register' %}">Create Account</a>
            </div>

        </div>

    </main>

</body>
</html>
