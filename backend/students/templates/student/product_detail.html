
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f6ff;
            font-family: Arial, sans-serif;
        }

        .detail-card {
            max-width: 950px;
            margin: 65px auto;
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(0,0,0,.09);
        }

        .product-img {
            width: 100%;
            height: 370px;
            object-fit: contain;
            background: #f7f9ff;
            border-radius: 15px;
            padding: 15px;
        }

        .product-name {
            font-size: 32px;
            font-weight: 700;
            color: #17213b;
        }

        .price {
            color: #078b60;
            font-size: 29px;
            font-weight: bold;
        }

        .back-btn {
            background: #1769d2;
            color: white;
            padding: 11px 22px;
            border-radius: 9px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="detail-card">
        <div class="row align-items-center g-4">

            <div class="col-md-6">
                {% if product.image_url %}
                    <img src="{{ product.image_url.url }}"
                         class="product-img"
                         alt="{{ product.name }}">
                {% else %}
                    <div class="product-img d-flex align-items-center justify-content-center">
                        No Image Available
                    </div>
                {% endif %}
            </div>

            <div class="col-md-6">
                <h1 class="product-name">{{ product.name }}</h1>

                <p class="text-muted mt-3">
                    {{ product.description }}
                </p>

                <div class="price">₹{{ product.price }}</div>

                <p class="mt-3">
                    <strong>Available Stock:</strong> {{ product.stock }}
                </p>

                {% if product.stock > 0 %}
                    <span class="badge bg-success mb-3">In Stock</span>
                {% else %}
                    <span class="badge bg-danger mb-3">Out of Stock</span>
                {% endif %}

                <div class="mt-4">
                    <a href="{% url 'products' %}" class="back-btn">
                        ← Back to Products
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
